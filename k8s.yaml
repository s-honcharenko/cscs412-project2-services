apiVersion: apps/v1
kind: Deployment
metadata:
  name: xin-arcade
  labels:
    app: xin-arcade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: xin-arcade
  template:
    metadata:
      labels:
        app: xin-arcade
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: xin-arcade
                topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: xin-arcade:latest
          imagePullPolicy: Never
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: xin-arcade
spec:
  type: NodePort
  selector:
    app: xin-arcade
  ports:
    - name: portal
      port: 8080
      nodePort: 8080
    - name: snake
      port: 8091
      nodePort: 8091
    - name: stack
      port: 8092
      nodePort: 8092
    - name: rocks
      port: 8093
      nodePort: 8093
    - name: invaders
      port: 8094
      nodePort: 8094
    - name: game-2048
      port: 8095
      nodePort: 8095
