<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048</title>
    <meta
      name="description"
      content="Merge matching tiles to reach 2048."
    />
    <link rel="icon" href="assets/NixOS.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/style.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="xin-header">
      <div class="xin-header-inner">
        <img class="xin-logo" src="assets/NixOS.svg" alt="Xin, Inc. logo" />
        <a class="xin-wordmark" href="/">Xin,&nbsp;Inc.</a>
        <div class="xin-service">
          <span class="xin-badge">Arcade &bull; 2048</span>
        </div>
      </div>
    </header>

    <main class="xin-main">
      <a class="game-back" id="back-to-games" href="/">Back to games</a>
      <h1 class="xin-title">2048</h1>
      <p class="xin-lede">
        Your goal is to reach a tile with 2048. Tiles with the same number merge
        when they meet.
      </p>

      <section class="xin-card game-card">
        <div class="xin-toolbar">
          <div class="game-scores">
            <div class="game-score">
              <span class="xin-label">Score</span>
              <span class="game-score-value" id="score">0</span>
            </div>
            <div class="game-score">
              <span class="xin-label">Best</span>
              <span class="game-score-value" id="best">0</span>
            </div>
          </div>
          <div class="game-buttons">
            <button class="xin-btn" id="undo" disabled>Undo</button>
            <button class="xin-btn xin-btn-primary" id="new">New game</button>
          </div>
        </div>

        <div class="game-stage">
          <div
            class="ark-board"
            id="board"
            tabindex="0"
            role="application"
            aria-label="2048 board. Use the arrow keys or H (left), J (down), K (up), and L (right) to slide the tiles."
          ></div>
          <div
            class="game-overlay is-game-over"
            id="overlay"
            role="region"
            aria-labelledby="overlay-title"
            aria-describedby="overlay-text"
            hidden
          >
            <p class="game-overlay-title" id="overlay-title"></p>
            <p class="game-overlay-text" id="overlay-text"></p>
            <div class="game-over-scores">
              <div class="game-score">
                <span class="xin-label" id="final-score-label">Final score</span>
                <span class="game-score-value" id="final-score">0</span>
              </div>
              <div class="game-score">
                <span class="xin-label">Best</span>
                <span class="game-score-value" id="final-best">0</span>
              </div>
            </div>
            <p class="game-over-hint">
              Press <kbd>Enter</kbd> or select
              <span id="overlay-action">Play again</span>.
            </p>
            <div class="game-overlay-buttons" id="overlay-buttons"></div>
          </div>
        </div>

        <p class="xin-note game-controls">
          <span>Move tiles:</span>
          <span><kbd>&larr;</kbd> (<kbd>H</kbd>)</span>
          <span><kbd>&darr;</kbd> (<kbd>J</kbd>)</span>
          <span><kbd>&uarr;</kbd> (<kbd>K</kbd>)</span>
          <span><kbd>&rarr;</kbd> (<kbd>L</kbd>)</span>
        </p>
      </section>
    </main>

    <footer class="xin-footer">
      <div class="xin-footer-inner">
        <span>&copy; 2026 Xin,&nbsp;Inc.</span>
        <span>2048</span>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
